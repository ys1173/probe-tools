server {
    listen 80;
    listen 443 ssl;
    server_name _;
    ssl_certificate /certs/tls.crt;
    ssl_certificate_key /certs/tls.key;
    default_type text/plain;
    location = / { return 200 "hello from e2e web\n"; }
    location = /meta { return 302 http://169.254.169.254/latest/meta-data/; }
    location = /isolated { return 302 http://10.204.0.40/; }
}
