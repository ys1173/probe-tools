# Example probe configuration, mounted at /etc/probe/probe.yaml inside the container.

# Where the hub's probe listener is (the public_url in the hub's hub.yaml). Probes only ever connect out to it.
hub_url: wss://hub.example.com:8443

# Name of the environment variable that holds the single-use enrolment token (see probe.env).
enroll_token_env: PROBE_ENROLL_TOKEN

# Identity is saved here (the probe-state volume).
state_dir: /var/lib/probe

# PEM CA certificate to trust for the hub's TLS certificate, when the hub uses a private CA. Empty uses the system
# roots. Mount the file in compose.yaml and point to the in-container path, e.g. /etc/probe/ca.crt.
ca_file: ""

# Plain ws:// to the hub. For local testing only.
insecure_plaintext: false

# What this probe is allowed to reach. mode is REQUIRED: the probe refuses to start without it.
#   closed: only the allow_cidrs / allow_hosts below   open: anything except deny_cidrs and the always-refused ranges (loopback, link-local/metadata, multicast, this probe's own addresses)
targets:
  mode: closed
  allow_cidrs:
    - 10.0.0.0/8
  allow_hosts:
    - "*.corp.example"
  deny_cidrs: []
  # Names no check may reach by that name (exact, or "*.example.com"). It matches requests made by name only: list
  # the addresses in deny_cidrs too to refuse them however they are asked for.
  deny_hosts: []
  #deny_hosts:
  #  - "*.payments.corp.example"

# Ports this probe may open for path_test listeners. With host networking these are opened on the host itself, so
# allow them in the site firewall; with bridge networking publish them in compose.yaml.
listen_ports: "40000-40100"

limits:
  max_concurrent: 4
  per_target_per_minute: 30

# Device commands over SSH (device_show, device_commands). Off by default. When on, the probe logs in to network
# devices with the profiles kept in the probe-state volume (/var/lib/probe/ssh/) and runs one allowed read-only
# command per request. Profiles, jump hosts and their secrets are never in this file: enter them in the running
# container (as the probe's own user), e.g.
#   docker compose exec -it probe probe ssh profile add --name core --cidr 10.1.0.0/16 --platform ios --username netops --auth password
#   docker compose exec -it probe probe ssh hostkey learn 10.1.0.1   # a password profile logs in only to devices whose key is recorded
#   docker compose exec -it probe probe ssh test --device 10.1.0.1 --command "show version"
# Devices are reached through the target policy above, so a device must be allowed there, and deny_cidrs /
# deny_hosts keep it away.
#ssh:
#  enabled: true
#  commands_file: /etc/probe/commands.yaml   # optional; mount it read-only in compose.yaml
#  max_output_bytes: 262144                  # 4096 to 4194304; output beyond what fits in one result is cut
#  connect_timeout_ms: 10000
#  auth_failure_cooldown_s: 600              # after a refused password, that device (or jump host) is not tried again for this long (0: off)

log_level: info
